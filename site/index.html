<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Basecamps · Accés a les ressenyes</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23234e42'/%3E%3Cpath d='M6 24 16 8 26 24M11 24l5-8 5 8' fill='none' stroke='%23f6f4ed' stroke-width='2'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:light;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#233e34;background:#f5f4ee}
    *{box-sizing:border-box}body{margin:0}button,input{font:inherit}[hidden]{display:none!important}
    .gate{min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 10%,#deebe1 0,transparent 45%),radial-gradient(ellipse at 95% 95%,#ece3cd 0,transparent 45%),#f5f4ee}
    .card{width:min(100%,440px);padding:38px;background:#fff;border:1px solid #dde4dd;border-radius:24px;box-shadow:0 20px 70px #243e3412}
    .logo{width:48px;height:48px;border-radius:14px;background:#234e42;color:#fff;display:grid;place-items:center;margin-bottom:28px}.logo svg{width:30px;height:30px}
    .eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#6b8174;margin:0 0 10px}h1{font-size:30px;line-height:1.18;margin:0 0 12px;letter-spacing:-.04em}.intro{line-height:1.6;color:#6c786f;font-size:14px;margin:0 0 26px}
    label{display:block;font-size:13px;font-weight:600;margin-bottom:9px}.input-wrap{display:flex;align-items:center;border:1px solid #c9d5cc;border-radius:11px;background:#fafbf8}.input-wrap:focus-within{outline:3px solid #bddece;outline-offset:2px}input{width:100%;min-width:0;padding:14px;border:0;background:transparent;outline:0;color:#253e33}.show{background:none;border:0;color:#5a7565;padding:14px 12px;cursor:pointer;font-size:12px}
    .submit{width:100%;padding:14px;margin-top:18px;background:#234e42;color:#fff;border:0;border-radius:11px;font-weight:600;cursor:pointer;transition:background .15s}.submit:hover{background:#163b30}.submit:disabled{opacity:.6;cursor:wait}.error{font-size:13px;color:#a1373a;line-height:1.5;margin:13px 0 0;min-height:20px}.note{color:#859087;font-size:11px;line-height:1.5;margin:24px 0 0}
    .viewer{height:100svh;display:flex;flex-direction:column}.sessionbar{height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;background:#234e42;color:#eef4ee;font-size:11px}.sessionbar strong{font-size:12px;letter-spacing:.05em}.sessionbar button{padding:5px 10px;border:1px solid #78998a;background:transparent;border-radius:5px;color:#fff;font-size:11px;cursor:pointer}.sessionbar button:hover{background:#ffffff17}iframe{width:100%;flex:1;min-height:0;border:0;background:#f5f4ee}button:focus-visible{outline:3px solid #95c9b2;outline-offset:3px}
    @media(max-width:480px){.card{padding:28px;border-radius:18px}h1{font-size:27px}.sessionbar{padding:0 10px}.session-label{display:none}}
  </style>
  <script src="gate.js" defer></script>
</head>
<body>
  <main id="gate" class="gate">
    <section class="card" aria-labelledby="title">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M4 25 16 6 28 25M11 25l5-8 5 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <p class="eyebrow">Basecamps · Espai privat</p>
      <h1 id="title">Visor de ressenyes</h1>
      <p class="intro">Introdueix la contrasenya per consultar les ressenyes i les seves evidències.</p>
      <form id="login">
        <label for="password">Contrasenya d’accés</label>
        <div class="input-wrap"><input id="password" type="password" autocomplete="current-password" required autofocus><button id="show" class="show" type="button" aria-label="Mostra la contrasenya" aria-pressed="false">Mostra</button></div>
        <button id="submit" class="submit" type="submit" disabled>Entrar al visor →</button>
        <p id="error" class="error" role="status" aria-live="polite">Preparant l’accés…</p>
      </form>
      <p class="note">Tanca la sessió quan acabis si fas servir un ordinador compartit.</p>
    </section>
  </main>
  <section id="viewer" class="viewer" hidden aria-label="Visor de ressenyes">
    <header class="sessionbar"><div><strong>BASECAMPS</strong><span class="session-label"> · Ressenyes · Accés privat</span></div><button id="logout" type="button">Tanca la sessió</button></header>
    <iframe id="frame" title="Ressenyes de Basecamps" referrerpolicy="no-referrer"></iframe>
  </section>
</body>
</html>
